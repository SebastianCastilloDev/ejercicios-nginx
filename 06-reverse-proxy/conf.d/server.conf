# "backend" es el nombre de un contenedor aparte (ej: docker run --name backend -p 3000:80 ...)
# En la misma red docker que lab, nginx resuelve el nombre del contenedor.
server {
    listen 80;

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        root /usr/share/nginx/html;
    }
}